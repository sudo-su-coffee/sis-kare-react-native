<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }

            font-family: 'Manrope', sans-serif;
            background-color: #031632;
        }
        .login-canvas {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }
        .curved-container {
            background-color: #f8f9ff;
            border-top-left-radius: 40px;
            border-top-right-radius: 40px;
            padding: 2.5rem 1.5rem 3rem 1.5rem;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.1);
        }
        .social-button {
            border: 1px solid #e2e8f0;
            background: white;
            transition: all 0.2s ease;
        }
        .social-button:active {
            background-color: #f1f5f9;
            transform: scale(0.98);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  <style data-stitch-cursor="">*{cursor:crosshair!important}[contenteditable="true"]:focus,.cursor-text:focus{cursor:text!important}</style><style data-stitch-scroll-lock="">html,body{overflow:hidden!important}</style></head>
<body class="bg-primary">
<div class="login-canvas">
<!-- Hero Branding Section -->
<div class="flex-grow flex flex-col items-center justify-center p-8">
<div class="mb-6 relative">
<div class="w-32 h-32 bg-white/10 rounded-full flex items-center justify-center backdrop-blur-md">

</div>
</div>
<div class="text-center">
<h1 class="font-headline-md text-headline-md text-on-primary tracking-wider">KARE-SIS</h1>
<p class="font-label-md text-label-md text-on-primary-container mt-1 opacity-80 uppercase tracking-widest">Student Information System</p>
</div>
</div>
<!-- Login Card -->
<div class="curved-container">
<div class="mb-8">
<h2 class="font-display-lg-mobile text-display-lg-mobile text-on-surface">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Please enter your credentials to access your portal.</p>
</div>
<form class="space-y-5">
<!-- Registration Number -->
<div>
<label class="font-label-bold text-label-bold text-on-surface-variant block mb-2 px-1">Register Number</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">badge</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border border-outline-variant rounded-xl focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all font-body-md text-on-surface" placeholder="e.g. 23CS101" type="text">
</div>
</div>
<!-- Password -->
<div>
<label class="font-label-bold text-label-bold text-on-surface-variant block mb-2 px-1">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-14 pl-12 pr-12 bg-surface-container-low border border-outline-variant rounded-xl focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-all font-body-md text-on-surface" placeholder="••••••••" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-secondary" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Options -->
<div class="flex items-center justify-between px-1">
<label class="flex items-center cursor-pointer">
<input class="w-5 h-5 rounded border-outline-variant text-secondary focus:ring-secondary" type="checkbox">
<span class="ml-2 font-body-sm text-body-sm text-on-surface-variant">Remember me</span>
</label>
<a class="font-body-sm text-body-sm text-secondary font-bold hover:underline" href="#">Forgot password?</a>
</div>
<!-- Action Button -->
<button class="w-full h-14 bg-primary text-on-primary font-headline-sm text-headline-sm rounded-xl shadow-lg hover:bg-primary-container transition-all active:scale-[0.98] mt-4" type="submit">
                    Sign In
                </button>
<!-- Divider -->
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 font-label-md text-label-md text-outline">OR</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Login -->
<button class="social-button w-full h-14 rounded-xl flex items-center justify-center gap-3" type="button">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBp7XenkH_o0SE4ePU4zsNWPKhljPqzraSyyfTOVz_lAdPb5EFhrnBguO42TkBe0_RU9ZA_WglsVkX4a8woZsDNFcHPlXR70kt3iHzgweJPVmiGXvn2I6aoHW9X4MeCjlDTSEoFLJIytjKCjEYWmYvqi0Oj1pybI3Hnj7DDkvkOtok_-nY2e3KyS3VsCUhUOCdZRQWE8C8A_rEBxReCLsi8Ogz6rvy4xtv3QWD3tRxRtDzd_4c1YyLDNZWuyjRFWyQBsfy5ZkHQAc8">
<span class="font-headline-sm text-headline-sm text-on-surface">Continue with Google</span>
</button>
</form>
<div class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-secondary font-bold hover:underline" href="#">Contact Admin</a>
</p>
<div class="mt-6 font-label-md text-label-md text-outline-variant uppercase tracking-tighter opacity-50">
                    SDT-KARE • v2.0.4
                </div>
</div>
</div>
</div>
